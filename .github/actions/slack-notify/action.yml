name: "Slack Notification Action"
description: "Send notifications to Slack about GitHub events"

inputs:
  STATUS:
    description: "Status of the workflow"
    required: true
  WEBHOOK_URL:
    description: "Slack webhook URL"
    required: true
  ENVIRONMENT:
    description: "Deployment environment"
    required: true
  WORKFLOW_NAME:
    description: "Name of the workflow"
    required: false
    default: "Deployment"

runs:
  using: "composite"
  steps:
    - name: Gather deployment context
      id: ctx
      shell: bash
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_URL: ${{ github.event.pull_request.html_url }}
        COMMIT_SHA: ${{ github.sha }}
        COMMIT_MSG: ${{ github.event.head_commit.message }}
        SERVER_URL: ${{ github.server_url }}
        REPO: ${{ github.repository }}
      run: |
        if [ -n "${PR_NUMBER}" ]; then
          # PR-triggered (e.g. feature deployments)
          echo "title=#${PR_NUMBER} ${PR_TITLE}" >> "$GITHUB_OUTPUT"
          echo "url=${PR_URL}" >> "$GITHUB_OUTPUT"
        else
          # Push-triggered (e.g. staging/production) — fall back to commit info
          SHORT_SHA="${COMMIT_SHA:0:7}"
          # First line of the commit message only
          SUBJECT="$(printf '%s' "${COMMIT_MSG}" | head -n1)"
          echo "title=${SHORT_SHA} ${SUBJECT}" >> "$GITHUB_OUTPUT"
          echo "url=${SERVER_URL}/${REPO}/commit/${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
        fi
        echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

    - name: Send Slack Notification
      uses: slackapi/slack-github-action@v3.0.1
      with:
        webhook-type: incoming-webhook
        webhook: ${{ inputs.WEBHOOK_URL }}
        payload: |
          {
            "text": "${{ inputs.STATUS == 'failure' && '<!here>' || '' }}",
            "attachments": [
              {
                "color": "${{ inputs.STATUS == 'success' && '#36a64f' || '#ff0000' }}",
                "title": "${{ steps.ctx.outputs.title }}",
                "title_link": "${{ steps.ctx.outputs.url }}",
                "text": "*Workflow:* ${{ inputs.WORKFLOW_NAME }}\n*Environment:* ${{ inputs.ENVIRONMENT }}",
                "mrkdwn_in": ["text"],
                "actions": [
                  {
                    "type": "button",
                    "text": "View on GitHub",
                    "url": "${{ steps.ctx.outputs.url }}",
                    "style": "${{ inputs.STATUS == 'success' && 'primary' || 'danger' }}"
                  }
                ],
                "footer": "GitHub Actions",
                "ts": "${{ steps.ctx.outputs.ts }}"
              }
            ]
          }
