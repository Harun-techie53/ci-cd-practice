name: "Slack Notification Action"
description: "Send notifications to Slack about GitHub events"

inputs:
  STATUS:
    description: "Status of the workflow"
    required: true
  WEBHOOK_URL:
    description: "Slack webhook URL"
    required: true
  ENVIRONMENT:
    description: "Deployment environment"
    required: true
  WORKFLOW_NAME:
    description: "Name of the workflow"
    required: false
    default: "Deployment"

runs:
  using: "composite"
  steps:
    - name: Gather deployment context
      id: ctx
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_URL: ${{ github.event.pull_request.html_url }}
        COMMIT_SHA: ${{ github.sha }}
        REPO: ${{ github.repository }}
      run: |
        if [ -z "${PR_NUMBER}" ]; then
          # Push-triggered (e.g. a merge to main) — the PR isn't in the event
          # payload, so look it up from the merge commit.
          pr_json="$(gh api "repos/${REPO}/commits/${COMMIT_SHA}/pulls")"
          PR_NUMBER="$(printf '%s' "${pr_json}" | jq -r '.[0].number // empty')"
          PR_TITLE="$(printf '%s' "${pr_json}" | jq -r '.[0].title // empty')"
          PR_URL="$(printf '%s' "${pr_json}" | jq -r '.[0].html_url // empty')"
        fi
        echo "title=#${PR_NUMBER} ${PR_TITLE}" >> "$GITHUB_OUTPUT"
        echo "url=${PR_URL}" >> "$GITHUB_OUTPUT"
        echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

    - name: Send Slack Notification
      uses: slackapi/slack-github-action@v3.0.1
      with:
        webhook-type: incoming-webhook
        webhook: ${{ inputs.WEBHOOK_URL }}
        payload: |
          {
            "text": "${{ inputs.STATUS == 'failure' && '<!here>' || '' }}",
            "attachments": [
              {
                "color": "${{ inputs.STATUS == 'success' && '#36a64f' || '#ff0000' }}",
                "title": "${{ steps.ctx.outputs.title }}",
                "title_link": "${{ steps.ctx.outputs.url }}",
                "text": "*Workflow:* ${{ inputs.WORKFLOW_NAME }}\n*Environment:* ${{ inputs.ENVIRONMENT }}",
                "mrkdwn_in": ["text"],
                "actions": [
                  {
                    "type": "button",
                    "text": "View on GitHub",
                    "url": "${{ steps.ctx.outputs.url }}",
                    "style": "${{ inputs.STATUS == 'success' && 'primary' || 'danger' }}"
                  }
                ],
                "footer": "GitHub Actions",
                "ts": "${{ steps.ctx.outputs.ts }}"
              }
            ]
          }
