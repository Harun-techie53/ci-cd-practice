name: Add Ready for QA Label to Linear Ticket

on:
  workflow_call:
    secrets:
      LINEAR_API_KEY:
        required: true
      GH_TOKEN:
        required: true

jobs:
  update-linear-ticket:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug token
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "ERROR: GH_TOKEN is empty!"
            exit 1
          else
            echo "GH_TOKEN is set (length: ${#GH_TOKEN} chars)"
            echo "Token prefix: ${GH_TOKEN:0:4}..."
          fi

          # Test token with curl directly
          echo "Testing token with GitHub API..."
          HTTP_CODE=$(curl -s -o /tmp/gh_response.json -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user)

          echo "HTTP Status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Token validation failed. Response:"
            cat /tmp/gh_response.json
            exit 1
          else
            echo "Token is valid!"
            cat /tmp/gh_response.json | jq '{login, id}'
          fi

      - name: Get PR associated with commit
        id: get-pr
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "Looking for PR associated with commit: ${{ github.sha }}"

          # Method 1: Try commits/pulls endpoint (works for merge commits)
          PR_RESPONSE=$(curl -sL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/pulls")

          PR_COUNT=$(echo "$PR_RESPONSE" | jq 'length')

          if [ "$PR_COUNT" -gt 0 ] && [ "$PR_COUNT" != "null" ]; then
            echo "Found PR via commits/pulls endpoint"
            PR_NUMBER=$(echo "$PR_RESPONSE" | jq -r '.[0].number')
            PR_TITLE=$(echo "$PR_RESPONSE" | jq -r '.[0].title')
            PR_BODY=$(echo "$PR_RESPONSE" | jq -r '.[0].body')
            BRANCH_NAME=$(echo "$PR_RESPONSE" | jq -r '.[0].head.ref')
          else
            # Method 2: For squash merges, get the most recently merged PR
            echo "Trying to find most recently merged PR..."

            PR_DATA=$(gh pr list --state merged --base main --limit 1 --json number,title,body,headRefName)

            if [ -z "$PR_DATA" ] || [ "$PR_DATA" == "[]" ]; then
              echo "No merged PR found"
              echo "found=false" >> $GITHUB_OUTPUT
              exit 0
            fi

            PR_NUMBER=$(echo "$PR_DATA" | jq -r '.[0].number')
            PR_TITLE=$(echo "$PR_DATA" | jq -r '.[0].title')
            PR_BODY=$(echo "$PR_DATA" | jq -r '.[0].body')
            BRANCH_NAME=$(echo "$PR_DATA" | jq -r '.[0].headRefName')
          fi

          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" == "null" ]; then
            echo "No PR found"
            echo "found=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Found PR #$PR_NUMBER"
          echo "PR Title: $PR_TITLE"
          echo "Branch: $BRANCH_NAME"

          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "pr_title=$PR_TITLE" >> $GITHUB_OUTPUT
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "found=true" >> $GITHUB_OUTPUT

          # Store PR body in a file to handle multiline content
          echo "$PR_BODY" > /tmp/pr_body.txt

      - name: Extract Linear Ticket ID
        if: steps.get-pr.outputs.found == 'true'
        id: extract-ticket
        run: |
          BRANCH_NAME="${{ steps.get-pr.outputs.branch_name }}"
          PR_TITLE="${{ steps.get-pr.outputs.pr_title }}"
          PR_BODY=$(cat /tmp/pr_body.txt 2>/dev/null || echo "")

          # Pattern matches Linear ticket formats case-insensitively (e.g., REP-123, rep-123, Rep-123)
          TICKET_ID=$(echo "$BRANCH_NAME" | grep -oiE 'pre-[0-9]+' | head -1)

          # If not found in branch name, try PR title
          if [ -z "$TICKET_ID" ]; then
            TICKET_ID=$(echo "$PR_TITLE" | grep -oiE 'pre-[0-9]+' | head -1)
          fi

          # If not found in PR title, try PR description
          if [ -z "$TICKET_ID" ]; then
            TICKET_ID=$(echo "$PR_BODY" | grep -oiE 'pre-[0-9]+' | head -1)
          fi

          if [ -z "$TICKET_ID" ]; then
            echo "No Linear ticket ID found in branch name, PR title, or PR description"
            echo "found=false" >> $GITHUB_OUTPUT
          else
            # Convert to uppercase for Linear API
            TICKET_ID=$(echo "$TICKET_ID" | tr '[:lower:]' '[:upper:]')
            echo "Found ticket ID: $TICKET_ID"
            echo "ticket_id=$TICKET_ID" >> $GITHUB_OUTPUT
            echo "found=true" >> $GITHUB_OUTPUT
          fi

          # Check if branch name contains "final" as a word
          if echo "$BRANCH_NAME" | grep -qiw 'final'; then
            echo "Branch contains 'final' — will update parent issue"
            echo "is_final=true" >> $GITHUB_OUTPUT
          else
            echo "is_final=false" >> $GITHUB_OUTPUT
          fi

      - name: Add Ready for QA Label
        if: steps.extract-ticket.outputs.found == 'true'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          TICKET_ID: ${{ steps.extract-ticket.outputs.ticket_id }}
          IS_FINAL: ${{ steps.extract-ticket.outputs.is_final }}
        run: |
          # First, get the issue ID from the ticket identifier
          ISSUE_RESPONSE=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: $LINEAR_API_KEY" \
            -d "{\"query\": \"query { issue(id: \\\"$TICKET_ID\\\") { id title description team { labels { nodes { id name } } states { nodes { id name } } } labels { nodes { id name } } parent { id identifier title description labels { nodes { id name } } team { labels { nodes { id name } } states { nodes { id name } } } } } }\"}" \
            https://api.linear.app/graphql)

          if [ -z "$ISSUE_RESPONSE" ]; then
            echo "Linear API request failed"
            exit 1
          fi

          # Extract issue ID
          ISSUE_ID=$(echo "$ISSUE_RESPONSE" | jq -r '.data.issue.id')

          if [ "$ISSUE_ID" == "null" ] || [ -z "$ISSUE_ID" ]; then
            echo "Could not find Linear issue with ID: $TICKET_ID"
            exit 1
          fi

          echo "Found issue ID: $ISSUE_ID"

          # Check if [no-qa] or [no-qa-needed] is in the issue title or description
          ISSUE_TITLE=$(echo "$ISSUE_RESPONSE" | jq -r '.data.issue.title // ""')
          ISSUE_DESCRIPTION=$(echo "$ISSUE_RESPONSE" | jq -r '.data.issue.description // ""')

          SKIP_CHILD_QA_LABEL=false
          if printf '%s' "$ISSUE_TITLE" | grep -qiE '\[no-qa(-needed)?\]' || printf '%s' "$ISSUE_DESCRIPTION" | grep -qiE '\[no-qa(-needed)?\]'; then
            echo "Skipping 'Ready for QA' label — issue contains [no-qa] or [no-qa-needed]"
            SKIP_CHILD_QA_LABEL=true
          fi

          # Add "Ready for QA" label to child issue unless skipped
          if [ "$SKIP_CHILD_QA_LABEL" == "false" ]; then
            # Find "Ready for QA" label in the child's team
            LABEL_ID=$(echo "$ISSUE_RESPONSE" | jq -r '.data.issue.team.labels.nodes[] | select(.name == "Ready for QA") | .id')

            if [ -z "$LABEL_ID" ] || [ "$LABEL_ID" == "null" ]; then
              echo "Label 'Ready for QA' not found in child team"
              exit 1
            fi

            echo "Found child label ID: $LABEL_ID"

            # Add new label to existing labels (unique handles empty arrays)
            ALL_LABELS=$(echo "$ISSUE_RESPONSE" | jq -c --arg labelId "$LABEL_ID" '[.data.issue.labels.nodes[].id] + [$labelId] | unique')

            echo "Updating issue with labels: $ALL_LABELS"

            # Build the GraphQL query with proper JSON escaping using jq
            QUERY=$(jq -n \
              --arg issueId "$ISSUE_ID" \
              --argjson labelIds "$ALL_LABELS" \
              '{query: "mutation UpdateIssue($issueId: String!, $labelIds: [String!]) { issueUpdate(id: $issueId, input: { labelIds: $labelIds }) { success issue { id identifier labels { nodes { name } } } } }", variables: {issueId: $issueId, labelIds: $labelIds}}')

            # Update the issue with the new label
            UPDATE_RESPONSE=$(curl -s -X POST \
              -H "Content-Type: application/json" \
              -H "Authorization: $LINEAR_API_KEY" \
              -d "$QUERY" \
              https://api.linear.app/graphql)

            SUCCESS=$(echo "$UPDATE_RESPONSE" | jq -r '.data.issueUpdate.success')

            if [ "$SUCCESS" == "true" ]; then
              echo "Successfully added 'Ready for QA' label to $TICKET_ID"
            else
              echo "Failed to update issue. Response: $UPDATE_RESPONSE"
              exit 1
            fi
          fi

          # If branch contains "final", update parent issue with "Ready for QA" label and "Done" state
          if [ "$IS_FINAL" == "true" ]; then
            PARENT_ID=$(echo "$ISSUE_RESPONSE" | jq -r '.data.issue.parent.id // ""')
            PARENT_IDENTIFIER=$(echo "$ISSUE_RESPONSE" | jq -r '.data.issue.parent.identifier // ""')

            if [ -z "$PARENT_ID" ] || [ "$PARENT_ID" == "null" ]; then
              echo "No parent issue found — skipping parent update"
            else
              echo "Updating parent issue: $PARENT_IDENTIFIER"

              # Check if parent issue has [no-qa] or [no-qa-needed] in title or description
              PARENT_TITLE=$(echo "$ISSUE_RESPONSE" | jq -r '.data.issue.parent.title // ""')
              PARENT_DESCRIPTION=$(echo "$ISSUE_RESPONSE" | jq -r '.data.issue.parent.description // ""')

              SKIP_PARENT_QA_LABEL=false
              if printf '%s' "$PARENT_TITLE" | grep -qiE '\[no-qa(-needed)?\]' || printf '%s' "$PARENT_DESCRIPTION" | grep -qiE '\[no-qa(-needed)?\]'; then
                echo "Skipping 'Ready for QA' label on parent — parent issue contains [no-qa] or [no-qa-needed]"
                SKIP_PARENT_QA_LABEL=true
              fi

              # Build parent label IDs
              if [ "$SKIP_PARENT_QA_LABEL" == "true" ]; then
                PARENT_LABELS=$(echo "$ISSUE_RESPONSE" | jq -c '[.data.issue.parent.labels.nodes[].id] | unique')
              else
                # Find "Ready for QA" label in the parent's team
                PARENT_LABEL_ID=$(echo "$ISSUE_RESPONSE" | jq -r '.data.issue.parent.team.labels.nodes[] | select(.name == "Ready for QA") | .id')

                if [ -z "$PARENT_LABEL_ID" ] || [ "$PARENT_LABEL_ID" == "null" ]; then
                  echo "Warning: Label 'Ready for QA' not found in parent team — keeping existing parent labels"
                  PARENT_LABELS=$(echo "$ISSUE_RESPONSE" | jq -c '[.data.issue.parent.labels.nodes[].id] | unique')
                else
                  echo "Found parent label ID: $PARENT_LABEL_ID"
                  PARENT_LABELS=$(echo "$ISSUE_RESPONSE" | jq -c --arg labelId "$PARENT_LABEL_ID" '[.data.issue.parent.labels.nodes[].id] + [$labelId] | unique')
                fi
              fi

              # Find "Done" state ID from parent's team
              DONE_STATE_ID=$(echo "$ISSUE_RESPONSE" | jq -r '.data.issue.parent.team.states.nodes[] | select(.name == "Done") | .id')

              if [ -z "$DONE_STATE_ID" ] || [ "$DONE_STATE_ID" == "null" ]; then
                echo "Warning: State 'Done' not found in parent's team — will add label only"
                PARENT_QUERY=$(jq -n \
                  --arg issueId "$PARENT_ID" \
                  --argjson labelIds "$PARENT_LABELS" \
                  '{query: "mutation UpdateParent($issueId: String!, $labelIds: [String!]) { issueUpdate(id: $issueId, input: { labelIds: $labelIds }) { success issue { id identifier labels { nodes { name } } } } }", variables: {issueId: $issueId, labelIds: $labelIds}}')
              else
                echo "Found 'Done' state ID: $DONE_STATE_ID"
                PARENT_QUERY=$(jq -n \
                  --arg issueId "$PARENT_ID" \
                  --argjson labelIds "$PARENT_LABELS" \
                  --arg stateId "$DONE_STATE_ID" \
                  '{query: "mutation UpdateParent($issueId: String!, $labelIds: [String!], $stateId: String!) { issueUpdate(id: $issueId, input: { labelIds: $labelIds, stateId: $stateId }) { success issue { id identifier labels { nodes { name } } state { name } } } }", variables: {issueId: $issueId, labelIds: $labelIds, stateId: $stateId}}')
              fi

              PARENT_RESPONSE=$(curl -s -X POST \
                -H "Content-Type: application/json" \
                -H "Authorization: $LINEAR_API_KEY" \
                -d "$PARENT_QUERY" \
                https://api.linear.app/graphql)

              PARENT_SUCCESS=$(echo "$PARENT_RESPONSE" | jq -r '.data.issueUpdate.success')

              if [ "$PARENT_SUCCESS" == "true" ]; then
                if [ -n "$DONE_STATE_ID" ] && [ "$DONE_STATE_ID" != "null" ] && [ "$SKIP_PARENT_QA_LABEL" == "false" ]; then
                  echo "Successfully updated parent issue $PARENT_IDENTIFIER with 'Ready for QA' label and 'Done' state"
                elif [ -n "$DONE_STATE_ID" ] && [ "$DONE_STATE_ID" != "null" ] && [ "$SKIP_PARENT_QA_LABEL" == "true" ]; then
                  echo "Successfully updated parent issue $PARENT_IDENTIFIER with 'Done' state (skipped 'Ready for QA' — parent contains [no-qa-needed])"
                elif [ "$SKIP_PARENT_QA_LABEL" == "true" ]; then
                  echo "No changes needed for parent issue $PARENT_IDENTIFIER (skipped 'Ready for QA' — parent contains [no-qa-needed])"
                else
                  echo "Successfully updated parent issue $PARENT_IDENTIFIER with 'Ready for QA' label"
                fi
              else
                echo "Failed to update parent issue (child issue $TICKET_ID was updated successfully). Response: $PARENT_RESPONSE"
                exit 1
              fi
            fi
          fi
